name = "portfolio"
main = "src/server/worker.js"
compatibility_date = "2025-01-01"

# Custom domains. Wrangler attaches these on every deploy (it creates the DNS records and certificates).
# If a deploy fails with a DNS conflict, delete the old record for that hostname in Cloudflare DNS and redeploy.
routes = [
  { pattern = "drewsburton.com", custom_domain = true },
  { pattern = "www.drewsburton.com", custom_domain = true },
]

# Static files: styles, scripts, images and the /admin screens.
[assets]
directory = "./public"
binding = "ASSETS"

# Replace database_id with the id of your D1 database (dashboard: Storage & Databases > D1).
[[d1_databases]]
binding = "DB"
database_name = "drew-portfolio"
database_id = "7d0de173-a7ec-485d-aa78-9c1674d65f84"
migrations_dir = "migrations"

# Bucket for uploaded images (dashboard: R2 Object Storage).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "drew-portfolio-media"

[observability]
enabled = true

# Secrets (never put these in this file). Add them under Settings > Variables and Secrets,
# or run `npx wrangler secret put NAME`:
#   ADMIN_PASSWORD     the password for /admin
#   SESSION_SECRET     any long random string (signs login cookies, salts analytics hashes)
#   GEMINI_API_KEY     powers the Stanley chat assistant (Google AI Studio has a free tier)
#   (or ANTHROPIC_API_KEY to use Claude instead)
# Optional variables: GEMINI_MODEL (default gemini-2.5-flash), CHAT_MODEL (Claude model)
